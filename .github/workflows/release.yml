# v* 태그를 push하면 Windows .exe와 설치 프로그램을 빌드해 GitHub Releases에 올림
#   (mirobot_sketch/__init__.py의 __version__을 올린 뒤)
#   git tag -a v0.1.1 -m "..." && git push origin v0.1.1
# 수동 실행(workflow_dispatch)은 빌드·검증만 하고 결과를 Actions 아티팩트로 남김
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# 로그의 한글 출력 (Windows 러너 기본 인코딩은 cp1252)
env:
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: 설치 (rembg 제외, 에이전트 포함)
        run: python -m pip install -e ".[build,agent]"
      - name: 버전 확인 (태그 = __version__)
        run: |
          $ver = python -c "import mirobot_sketch; print(mirobot_sketch.__version__)"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$ver") {
            Write-Error "태그 ${{ github.ref_name }}와 코드 버전 v$ver가 다릅니다. __init__.py의 __version__을 맞추세요."
            exit 1
          }
          "VERSION=$ver" >> $env:GITHUB_ENV
      - name: 테스트
        run: python -m unittest discover -s tests
      - name: PyInstaller 빌드
        run: pyinstaller packaging/mirobot_sketch.spec --noconfirm
      - name: 빌드된 exe 동작 확인
        run: |
          $env:APPDATA = "$env:RUNNER_TEMP\appdata"
          dist\MirobotSketch\mirobot.exe draw trajectories\orientation-test-F.json --gcode-out F.gcode
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dist\MirobotSketch\mirobot.exe sim trajectories\orientation-test-F.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # 에이전트 MCP 서버: 브리지 정보 없이 실행하면 안내 후 종료 코드 2 (모듈 누락이면 1)
          dist\MirobotSketch\mirobot.exe mcp
          if ($LASTEXITCODE -ne 2) { Write-Error "exe에 MCP 서버 모듈이 빠졌습니다 (exit $LASTEXITCODE)"; exit 1 }
          # 로봇 없이 실행 절차 전체(호밍 → 명령·ok → 기록): 가상 시뮬레이션
          "yes" | dist\MirobotSketch\mirobot.exe draw trajectories\orientation-test-F.json --execute --virtual --virtual-speed 200
          if ($LASTEXITCODE -ne 0) { Write-Error "가상 시뮬레이션 실행 실패 (exit $LASTEXITCODE)"; exit 1 }
          # RViz 따라가기가 WSL에서 불러 쓰는 모듈이 설치판에 들어갔는지
          if (-not (Test-Path dist\MirobotSketch\_internal\sim\mirobot_sketch\live_progress.py)) { Write-Error "sim/mirobot_sketch/live_progress.py 없음"; exit 1 }
          # 설치 도우미의 예비 경로(직접 설치) 스크립트와 얼굴 검출 모델
          if (-not (Test-Path dist\MirobotSketch\_internal\wsl\setup_ros_env.sh)) { Write-Error "wsl/setup_ros_env.sh 없음"; exit 1 }
          if (-not (Test-Path dist\MirobotSketch\_internal\mirobot_sketch\data\face_detection_yunet_2023mar.onnx)) { Write-Error "얼굴 검출 모델 없음"; exit 1 }
          dist\MirobotSketch\mirobot.exe setup-rviz --help
          if ($LASTEXITCODE -ne 0) { Write-Error "setup-rviz 명령 실패"; exit 1 }

      - name: 설치 프로그램 빌드 (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DMyAppVersion=$env:VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "SETUP=dist\installer\MirobotSketch-Setup-$env:VERSION.exe" >> $env:GITHUB_ENV
      - name: 설치 → 실행 → 제거 검증
        run: |
          $dir = "$env:RUNNER_TEMP\MirobotSketch"
          Start-Process $env:SETUP -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"" -Wait
          if (-not (Test-Path "$dir\MirobotSketch.exe")) { Write-Error "설치 실패: $dir\MirobotSketch.exe 없음"; exit 1 }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "Mirobot Sketch.lnk"
          if (-not $lnk) { Write-Error "시작 메뉴 바로가기 없음"; exit 1 }
          "시작 메뉴 바로가기: $($lnk.FullName)"
          $env:APPDATA = "$env:RUNNER_TEMP\appdata2"
          & "$dir\mirobot.exe" sim trajectories\orientation-test-F.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:APPDATA = [Environment]::GetFolderPath('ApplicationData')
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep 3
          if (Test-Path "$dir\MirobotSketch.exe") { Write-Error "제거 실패"; exit 1 }
          "설치·실행·제거 확인 완료"

      - name: 압축 (설치 없이 쓰는 버전)
        run: |
          $zip = "MirobotSketch-v$env:VERSION-windows-x64.zip"
          Compress-Archive -Path dist\MirobotSketch -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v7
        with:
          name: MirobotSketch-windows-x64
          path: |
            ${{ env.ZIP }}
            ${{ env.SETUP }}
      - name: GitHub Release에 올리기
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.SETUP }}
            ${{ env.ZIP }}
          generate_release_notes: true

  # RViz 3D 환경 이미지: ubuntu:22.04 컨테이너에서 설치 스크립트(--image)를 돌려 WSL로 가져올 수 있는 루트 파일로 내보냄
  # (앱의 설치 도우미가 이 파일을 받아 `wsl --import MirobotSketch-ROS`로 설치)
  wsl-image:
    # windows 작업이 릴리스를 먼저 만든 뒤 올림 (두 작업이 같은 릴리스를 동시에 만들면 충돌)
    needs: windows
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: 버전 확인 (태그 = __version__)
        run: |
          VER=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('mirobot_sketch/__init__.py', encoding='utf-8').read()).group(1))")
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$VER" ]; then
            echo "태그 ${{ github.ref_name }}와 코드 버전 v$VER가 다릅니다"; exit 1
          fi
          echo "IMG=MirobotSketch-ROS-humble-$VER.tar.gz" >> "$GITHUB_ENV"
      - name: 이미지 만들기 (setup_ros_env.sh --image)
        run: |
          docker run --name rosimg -v "$PWD:/work:ro" ubuntu:22.04 bash /work/packaging/wsl/setup_ros_env.sh --image | tee setup.log
          grep -qx SETUP_OK setup.log
      - name: 이미지 안에서 확인 (사용자 mirobot으로 ROS·모델·robot_state_publisher)
        run: |
          docker commit rosimg mirobot-ros:check
          docker run --rm -u mirobot mirobot-ros:check bash -lc 'source /opt/ros/humble/setup.bash && source ~/mirobot_ws/install/setup.bash && ros2 pkg prefix wlkata_mirobot_description && ls /opt/ros/humble/lib/robot_state_publisher/robot_state_publisher'
          docker run --rm mirobot-ros:check cat /etc/wsl.conf
      - name: 내보내기 · 압축 · SHA256 · 크기 검사 (1900MB 이하, GitHub 릴리스 파일 한도 2GB)
        run: |
          docker export rosimg | gzip -9 > "$IMG"
          sha256sum "$IMG" | tee "$IMG.sha256"
          SIZE=$(stat -c %s "$IMG")
          echo "이미지 크기: $((SIZE / 1024 / 1024)) MB"
          if [ "$SIZE" -gt $((1900 * 1024 * 1024)) ]; then echo "이미지가 1900MB를 넘습니다"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: MirobotSketch-ROS-image
          path: |
            ${{ env.IMG }}
            ${{ env.IMG }}.sha256
          retention-days: 3
      - name: GitHub Release에 올리기
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.IMG }}
            ${{ env.IMG }}.sha256
